[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-sense"
version = "0.1.0"
description = "Transformer-based news topic classifier built with Hugging Face Transformers."
authors = [
    {name = "Jack Shewring"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch",
    "transformers",
    "datasets",
    "evaluate",
    "accelerate",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "numpy",
    "gradio"
]

[tool.setuptools.packages.find]
where = ["src"]